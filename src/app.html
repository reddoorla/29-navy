<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The reference's own two icons, shipped as files rather than redrawn:
         favicon-32x32.png and "Artboard 1.png" from 29navy.com's <head>
         (matching/spec/index.html). The template default that used to sit here
         was a 128x128 grey placeholder, which is why the tab looked empty. -->
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- display:contents wrapper per SvelteKit's recommendation: placing the app
         directly inside <body> can break when browser extensions inject nodes. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
